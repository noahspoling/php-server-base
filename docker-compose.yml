services:
  # Apache Web Server
  apache:
    build: ./apache
    container_name: lamp_apache
    ports:
      - "8080:80"
    volumes:
      # Same path as the php service: SetHandler proxy:fcgi passes Apache's
      # local SCRIPT_FILENAME to php-fpm, so the two must agree.
      - ./:/var/www/app
    depends_on:
      - php
      - mysql
    networks:
      - lamp_network

  # PHP-FPM Service
  php:
    build: ./php
    container_name: lamp_php
    volumes:
      - ./:/var/www/app
    environment:
      APP_DEBUG: ${APP_DEBUG:-false}
      CSP_ALLOW_EVAL: ${CSP_ALLOW_EVAL:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - lamp_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lamp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    networks:
      - lamp_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lamp_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - lamp_network

volumes:
  mysql_data:

networks:
  lamp_network:
    driver: bridge
