version: '3.8'

services:
  # PHP-FPM Service
  php:
    build: ./php
    container_name: lamp_php
    volumes:
      # Keeps the whole application mapped so PHP can access config, vendor, and src folders
      - ./www:/var/www/html
    networks:
      - lamp_network
    # Run Composer and automate moving your front-end assets on startup
    command: >
      sh -c "composer install --no-interaction &&
             mkdir -p /var/www/html/public/js &&
             cp /var/www/html/vendor/bower-asset/htmx.org/dist/htmx.min.js /var/www/html/public/js/htmx.js &&
             cp /var/www/html/vendor/npm-asset/hyperscript.org/dist/_hyperscript.min.js /var/www/html/public/js/hyperscript.js &&
             exec php-fpm"

  # Apache Web Server
  apache:
    build: ./apache
    container_name: lamp_apache
    ports:
      - "8080:80"
    volumes:
      # Map the full folder here too, so Apache can resolve static asset paths in public/
      - ./www:/var/www/html
    networks:
      - lamp_network
    depends_on:
      - php

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: lamp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    networks:
      - lamp_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lamp_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - lamp_network

volumes:
  mysql_data:

networks:
  lamp_network:
    driver: bridge
