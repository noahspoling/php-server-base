# Application configuration for php-server-base.
#
# Included at the end of httpd.conf, so the DocumentRoot here replaces the
# image default.

ServerName localhost

# The webroot is the www/ subdirectory, not the project root. src/, views/,
# config/ and vendor/ sit outside it and are not addressable by URL.
DocumentRoot "/var/www/app/www"

<Directory "/var/www/app/www">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.php

# PHP executes in the php-fpm container. SetHandler rather than ProxyPassMatch:
# ProxyPassMatch resolves before mod_rewrite and would bypass the front
# controller, while SetHandler runs afterwards so rewritten URLs still reach PHP.
#
# This passes Apache's local SCRIPT_FILENAME to php-fpm, which is why both
# containers must mount the project at the same path.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Checksummed asset URLs never exist on disk. Strip the hash to find the
    # real file, and flag the request so only hashed URLs are cached forever.
    RewriteRule ^/static/(.+)\.[0-9a-f]{8}\.(css|js|svg|png|jpg|webp|woff2)$ /static/$1.$2 [L,E=HASHED_ASSET:1]

    # Everything else is the application's problem.
    RewriteCond %{REQUEST_URI} !^/static/
    RewriteCond %{REQUEST_URI} !^/index\.php$
    RewriteRule ^ /index.php [L]
</IfModule>

<IfModule mod_headers.c>
    # Only URLs that carried a checksum get the immutable promise. A request for
    # the unhashed /static/base.css gets no Cache-Control and falls back to ETag
    # revalidation, so a hand-written link cannot pin a stale file for a year.
    Header always set Cache-Control "public, max-age=31536000, immutable" env=HASHED_ASSET
</IfModule>
